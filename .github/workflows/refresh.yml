# Monthly: fetch the newest WHO life tables (and try the SSA table), validate them, and if they
# changed, commit and redeploy. The tables change about once a year; checking monthly catches the
# new SSA table soon after each Trustees Report. Fails safe: invalid or unreachable tables are
# never written, and the site keeps the last good ones.
# Since 2026-11-22 a WHO failure is a warning until WHO refreshes have failed on every run for 45
# days (the third monthly run in a row); data/refresh-state.json holds the date that streak began.
# ssa.gov refuses GitHub's runners, so the SSA attempt ends in a notice (see OPERATIONS.md).
name: Refresh life tables

on:
  schedule:
    - cron: "23 6 3 * *"   # the 3rd of every month, 06:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Fetch and validate WHO and SSA life tables
        run: python3 pipeline/lifetables.py refresh
      - name: Tests against the new tables
        run: |
          python3 -m unittest discover -s tests
          node --test tests/js/*.test.mjs
      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/who.json data/ssa.json data/refresh-state.json
          if git diff --cached --quiet; then
            echo "Life tables unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet -- data/who.json data/ssa.json; then
            # Only data/refresh-state.json changed: a streak of failed WHO refreshes began or ended.
            # The site doesn't read that file, so there's nothing to redeploy.
            git commit -m "WHO refresh status $(date -u +%F)"
            git push
            exit 0
          fi
          git commit -m "Life tables refresh $(date -u +%F)"
          git push
          gh workflow run pages.yml --ref main
